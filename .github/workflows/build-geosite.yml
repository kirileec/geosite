name: Build geosite.dat from upstream URL + custom groups

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    paths:
      - "custom/**"
      - ".github/workflows/build-geosite.yml"

env:
  UPSTREAM_GEOSITE_URL: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geosite.dat

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Download upstream geosite.dat
        run: curl -fL "$UPSTREAM_GEOSITE_URL" -o upstream-geosite.dat

      - name: Checkout domain-list-community (build toolchain only)
        uses: actions/checkout@v4
        with:
          repository: v2fly/domain-list-community
          path: dlc

      - name: Unpack upstream dat into plain lists
        working-directory: unpack
        run: |
          rm -rf ../dlc/data
          mkdir -p ../dlc/data
          go run . -inputdata=../upstream-geosite.dat -outputdir=../dlc/data

      - name: Inject custom groups
        run: |
          shopt -s nullglob
          for f in custom/*.txt; do
            cp "$f" "dlc/data/$(basename "$f" .txt)"
          done

      - name: Build geosite.dat
        working-directory: dlc
        run: |
          go run ./
          mv dlc.dat ../geosite.dat

      - uses: actions/upload-artifact@v4
        with:
          name: geosite-dat
          path: geosite.dat

      - name: Commit geosite.dat to repo root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add geosite.dat
          if git diff --cached --quiet; then
            echo "geosite.dat unchanged, skip commit"
          else
            git commit -m "Update geosite.dat"
            git push origin HEAD:main
          fi
